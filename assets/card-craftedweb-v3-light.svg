<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="CraftedWeb Studio OS">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", monospace; }
      @keyframes pulseDotLight {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }
      .beacon { animation: pulseDotLight 2s infinite; transform-origin: center; }
      @media (prefers-reduced-motion: reduce) { .beacon { animation: none; } }
    </style>
  </defs>

  <rect width="400" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="0" y="0" width="6" height="230" rx="3" fill="#0284c7" />
  <rect x="0" y="0" width="400" height="2.5" rx="1" fill="#0284c7" fill-opacity="0.8" />

  <g transform="translate(28, 30)">
    <!-- Category Tag -->
    <text x="0" y="0" fill="#0284c7" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">0→1 PRODUCT ENGINE</text>

    <!-- Title -->
    <text x="0" y="28" fill="#0f172a" font-size="19" font-weight="800" class="font-sans">CraftedWeb Studio OS</text>

    <!-- Bullets -->
    <g transform="translate(0, 52)" class="font-sans" font-size="12.5" fill="#475569">
      <circle cx="2" cy="7" r="2.5" fill="#0284c7" />
      <text x="14" y="11">Full-stack Next.js 14 &amp; Supabase agency OS</text>

      <circle cx="2" cy="33" r="2.5" fill="#0284c7" />
      <text x="14" y="37">Headless Playwright outreach &amp; video capture</text>

      <circle cx="2" cy="59" r="2.5" fill="#0284c7" />
      <text x="14" y="63">87 automated tests (100% test pass rate)</text>
    </g>

    <!-- Footer Status -->
    <g transform="translate(0, 154)">
      <line x1="0" y1="0" x2="344" y2="0" stroke="#e2e8f0" stroke-dasharray="4 4" />
      <circle cx="4" cy="18" r="3.5" fill="#0284c7" class="beacon" />
      <text x="16" y="22" fill="#0284c7" font-size="11" font-weight="600" class="font-mono">&#x2713; PRODUCTION VERIFIED</text>
    </g>
  </g>
</svg>
