<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="Voxel QR - open source 3D QR code generator">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", monospace; }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.8); }
      }
      @keyframes scanSweep {
        0%, 8% { transform: translateY(0); opacity: 0; }
        14% { opacity: 0.9; }
        82% { opacity: 0.9; }
        88%, 100% { transform: translateY(52px); opacity: 0; }
      }
      .beacon { animation: pulseDot 2s infinite; transform-origin: center; }
      .scanline { animation: scanSweep 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      @media (prefers-reduced-motion: reduce) {
        .beacon { animation: none; }
        .scanline { animation: none; opacity: 0.55; }
      }
    </style>
  </defs>

  <rect width="400" height="230" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
  <rect x="0" y="0" width="6" height="230" rx="3" fill="#f43f5e" />
  <rect x="0" y="0" width="400" height="2.5" rx="1" fill="#f43f5e" fill-opacity="0.8" />

  <!-- Mini QR motif -->
  <g transform="translate(322, 22)">
    <g fill="#334155">
    <rect x="6" y="24" width="5.5" height="5.5"/>
    <rect x="18" y="6" width="5.5" height="5.5"/>
    <rect x="18" y="36" width="5.5" height="5.5"/>
    <rect x="24" y="18" width="5.5" height="5.5"/>
    <rect x="24" y="30" width="5.5" height="5.5"/>
    <rect x="24" y="42" width="5.5" height="5.5"/>
    <rect x="30" y="0" width="5.5" height="5.5"/>
    <rect x="30" y="18" width="5.5" height="5.5"/>
    <rect x="36" y="48" width="5.5" height="5.5"/>
    <rect x="42" y="18" width="5.5" height="5.5"/>
    <rect x="42" y="24" width="5.5" height="5.5"/>
    <rect x="42" y="30" width="5.5" height="5.5"/>
    <rect x="42" y="42" width="5.5" height="5.5"/>
    <rect x="48" y="36" width="5.5" height="5.5"/>
    </g>
    <g fill="#fb7185">
    <rect x="0" y="0" width="5.5" height="5.5"/>
    <rect x="0" y="6" width="5.5" height="5.5"/>
    <rect x="0" y="12" width="5.5" height="5.5"/>
    <rect x="0" y="36" width="5.5" height="5.5"/>
    <rect x="0" y="42" width="5.5" height="5.5"/>
    <rect x="0" y="48" width="5.5" height="5.5"/>
    <rect x="6" y="0" width="5.5" height="5.5"/>
    <rect x="6" y="6" width="5.5" height="5.5"/>
    <rect x="6" y="12" width="5.5" height="5.5"/>
    <rect x="6" y="36" width="5.5" height="5.5"/>
    <rect x="6" y="42" width="5.5" height="5.5"/>
    <rect x="6" y="48" width="5.5" height="5.5"/>
    <rect x="12" y="0" width="5.5" height="5.5"/>
    <rect x="12" y="6" width="5.5" height="5.5"/>
    <rect x="12" y="12" width="5.5" height="5.5"/>
    <rect x="12" y="36" width="5.5" height="5.5"/>
    <rect x="12" y="42" width="5.5" height="5.5"/>
    <rect x="12" y="48" width="5.5" height="5.5"/>
    <rect x="18" y="0" width="5.5" height="5.5"/>
    <rect x="18" y="30" width="5.5" height="5.5"/>
    <rect x="18" y="42" width="5.5" height="5.5"/>
    <rect x="24" y="6" width="5.5" height="5.5"/>
    <rect x="24" y="36" width="5.5" height="5.5"/>
    <rect x="30" y="12" width="5.5" height="5.5"/>
    <rect x="30" y="48" width="5.5" height="5.5"/>
    <rect x="36" y="0" width="5.5" height="5.5"/>
    <rect x="36" y="6" width="5.5" height="5.5"/>
    <rect x="36" y="12" width="5.5" height="5.5"/>
    <rect x="36" y="18" width="5.5" height="5.5"/>
    <rect x="36" y="30" width="5.5" height="5.5"/>
    <rect x="36" y="42" width="5.5" height="5.5"/>
    <rect x="42" y="0" width="5.5" height="5.5"/>
    <rect x="42" y="6" width="5.5" height="5.5"/>
    <rect x="42" y="12" width="5.5" height="5.5"/>
    <rect x="42" y="36" width="5.5" height="5.5"/>
    <rect x="42" y="48" width="5.5" height="5.5"/>
    <rect x="48" y="0" width="5.5" height="5.5"/>
    <rect x="48" y="6" width="5.5" height="5.5"/>
    <rect x="48" y="12" width="5.5" height="5.5"/>
    <rect x="48" y="18" width="5.5" height="5.5"/>
    <rect x="48" y="30" width="5.5" height="5.5"/>
    <rect x="48" y="42" width="5.5" height="5.5"/>
    </g>
    <rect class="scanline" x="-2" y="-1" width="58" height="2" rx="1" fill="#fb7185"/>
  </g>

  <g transform="translate(28, 30)">
    <!-- Category Tag -->
    <text x="0" y="0" fill="#fb7185" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">OPEN SOURCE</text>

    <!-- Title -->
    <text x="0" y="28" fill="#f8fafc" font-size="19" font-weight="800" class="font-sans">Voxel QR — 3D Codegen</text>

    <!-- Bullets -->
    <g transform="translate(0, 52)" class="font-sans" font-size="12.5" fill="#94a3b8">
      <circle cx="2" cy="7" r="2.5" fill="#f43f5e" />
      <text x="14" y="11">Custom WebGL2 voxel renderer, zero frameworks</text>

      <circle cx="2" cy="33" r="2.5" fill="#f43f5e" />
      <text x="14" y="37">36 procedural models with Level-H error correction</text>

      <circle cx="2" cy="59" r="2.5" fill="#f43f5e" />
      <text x="14" y="63">Photo-to-relief mode • jsQR scan-verified tests</text>
    </g>

    <!-- Footer Status -->
    <g transform="translate(0, 154)">
      <line x1="0" y1="0" x2="344" y2="0" stroke="#1e293b" stroke-dasharray="4 4" />
      <circle cx="4" cy="18" r="3.5" fill="#fb7185" class="beacon" />
      <text x="16" y="22" fill="#fb7185" font-size="11" font-weight="600" class="font-mono">RUNS 100% IN BROWSER</text>
    </g>
  </g>
</svg>
