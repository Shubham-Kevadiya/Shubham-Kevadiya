<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="Resilient Task Queue">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", monospace; }
    </style>
  </defs>

  <rect width="400" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
  <rect x="0" y="0" width="6" height="230" rx="3" fill="#059669" />

  <g transform="translate(28, 32)">
    <!-- Category Tag -->
    <text x="0" y="0" fill="#059669" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">DISTRIBUTED SYSTEMS</text>

    <!-- Title -->
    <text x="0" y="28" fill="#0f172a" font-size="19" font-weight="800" class="font-sans">Resilient Task Queue</text>

    <!-- Bullets -->
    <g transform="translate(0, 54)" class="font-sans" font-size="12.5" fill="#64748b">
      <circle cx="2" cy="7" r="2.5" fill="#059669" />
      <text x="14" y="11">BullMQ & Redis high-throughput workers</text>

      <circle cx="2" cy="33" r="2.5" fill="#059669" />
      <text x="14" y="37">Crash isolation & worker failure recovery</text>

      <circle cx="2" cy="59" r="2.5" fill="#059669" />
      <text x="14" y="63">Dead-letter queue (DLQ) automated replay</text>
    </g>

    <!-- Footer Status -->
    <g transform="translate(0, 154)">
      <line x1="0" y1="0" x2="344" y2="0" stroke="#e2e8f0" />
      <text x="0" y="20" fill="#059669" font-size="11" font-weight="600" class="font-mono">✓ PRODUCTION VERIFIED</text>
    </g>
  </g>
</svg>