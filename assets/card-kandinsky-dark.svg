<svg xmlns="http://www.w3.org/2000/svg" width="400" height="230" viewBox="0 0 400 230" role="img" aria-label="Kandinsky SaaS Platform">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: "SF Mono", Monaco, "Cascadia Code", "Fira Code", monospace; }
    </style>
  </defs>

  <rect width="400" height="230" rx="12" fill="#0b101d" stroke="#1e293b" stroke-width="1.5" />
  <rect x="0" y="0" width="6" height="230" rx="3" fill="#8b5cf6" />

  <g transform="translate(28, 32)">
    <!-- Category Tag -->
    <text x="0" y="0" fill="#8b5cf6" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">SPHERE TECHLABS</text>

    <!-- Title -->
    <text x="0" y="28" fill="#f8fafc" font-size="19" font-weight="800" class="font-sans">Kandinsky SaaS Platform</text>

    <!-- Bullets -->
    <g transform="translate(0, 54)" class="font-sans" font-size="12.5" fill="#94a3b8">
      <circle cx="2" cy="7" r="2.5" fill="#8b5cf6" />
      <text x="14" y="11">Multi-tenant PostgreSQL schema isolation</text>

      <circle cx="2" cy="33" r="2.5" fill="#8b5cf6" />
      <text x="14" y="37">Bulk art ingestion pipelines with automated sync</text>

      <circle cx="2" cy="59" r="2.5" fill="#8b5cf6" />
      <text x="14" y="63">Stripe subscription lifecycles & webhook retries</text>
    </g>

    <!-- Footer Status -->
    <g transform="translate(0, 154)">
      <line x1="0" y1="0" x2="344" y2="0" stroke="#1e293b" />
      <text x="0" y="20" fill="#8b5cf6" font-size="11" font-weight="600" class="font-mono">✓ PRODUCTION VERIFIED</text>
    </g>
  </g>
</svg>